  <body class="bg-slate-950 text-slate-900 antialiased font-sans">
    <div id="root">
      <!-- High-Performance Instant Initial Splash (Auto-replaced by React on mount) -->
      <div id="orbix-splash" style="position:fixed;inset:0;background:#020617;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999999;color:#fff;font-family:'Readex Pro',system-ui,-apple-system,sans-serif;user-select:none;text-align:center;padding:16px;" dir="rtl">
        <style>
          @keyframes orbix-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
          @keyframes orbix-pulse { 0%, 100% { opacity: 0.3; transform: scale(0.95); } 50% { opacity: 0.7; transform: scale(1.05); } }
          @keyframes orbix-shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(200%); } }
        </style>
        <div style="position:relative;width:90px;height:90px;display:flex;align-items:center;justify-content:center;margin-bottom:24px;">
          <div style="position:absolute;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle, rgba(16,185,129,0.25) 0%, transparent 70%);animation:orbix-pulse 3s ease-in-out infinite;"></div>
          <div style="position:absolute;inset:-6px;border-radius:50%;border:1.5px dashed rgba(16,185,129,0.35);animation:orbix-spin 16s linear infinite;"></div>
          <div style="width:72px;height:72px;border-radius:22px;background:linear-gradient(135deg,rgba(15,23,42,0.95),rgba(2,6,23,0.98));border:1.5px solid rgba(16,185,129,0.45);display:flex;align-items:center;justify-content:center;box-shadow:0 0 35px rgba(16,185,129,0.25);position:relative;z-index:2;">
            <svg viewBox="144 523 304 304" fill="none" style="width:44px;height:44px;">

              <circle cx="296.288" cy="675.003" r="45.399" fill="#0FBE7B"/>
            </svg>
          </div>
        </div>
        <div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:6px;direction:ltr;">
          <span style="font-size:26px;font-weight:900;letter-spacing:0.2em;color:#f8fafc;">ORBIX</span>
          <span style="font-size:11px;font-weight:800;background:rgba(16,185,129,0.15);color:#34d399;padding:2px 8px;border-radius:6px;border:1px solid rgba(16,185,129,0.3);letter-spacing:0.1em;">ERP</span>
        </div>
        <p style="font-size:12px;font-weight:600;color:#94a3b8;margin:0 0 24px 0;letter-spacing:0.02em;">النظام السحابي المتكامل لإدارة الموارد</p>
        <div style="width:200px;height:3px;background:rgba(15,23,42,0.9);border-radius:999px;overflow:hidden;position:relative;border:1px solid rgba(30,41,59,0.8);">
          <div style="width:50%;height:100%;background:linear-gradient(90deg,transparent,#10b981,#38bdf8,transparent);animation:orbix-shimmer 1.4s ease-in-out infinite;position:absolute;inset:0;"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
