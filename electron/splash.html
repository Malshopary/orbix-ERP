<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orbix ERP - Loading</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: transparent;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Kufi Arabic', sans-serif;
      overflow: hidden;
    }

    /* Main Glassmorphic Card */
    .splash-card {
      position: relative;
      width: 500px;
      height: 350px;
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.96) 0%, rgba(2, 6, 23, 0.98) 100%);
      border-radius: 24px;
      border: 1px solid rgba(16, 185, 129, 0.25);
      box-shadow: 
        0 25px 50px -12px rgba(0, 0, 0, 0.8),
        0 0 35px rgba(16, 185, 129, 0.15),
        inset 0 1px 1px rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 32px 28px 24px;
      overflow: hidden;
      -webkit-app-region: drag;
    }

    /* Ambient Glowing Orbs */
    .ambient-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(50px);
      pointer-events: none;
      z-index: 0;
    }
    .ambient-orb-1 {
      top: -40px;
      right: -40px;
      width: 160px;
      height: 160px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.28) 0%, transparent 70%);
    }
    .ambient-orb-2 {
      bottom: -40px;
      left: -40px;
      width: 180px;
      height: 180px;
      background: radial-gradient(circle, rgba(6, 182, 212, 0.22) 0%, transparent 70%);
    }

    /* Top Badge */
    .top-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 14px;
      border-radius: 9999px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #10b981;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      z-index: 1;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.15);
    }
    .top-badge .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
      animation: badgePulse 1.5s infinite ease-in-out;
    }

    @keyframes badgePulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.4); opacity: 1; }
    }

    /* Central Logo & Orbital Rings */
    .logo-container {
      position: relative;
      width: 110px;
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 4px;
      z-index: 1;
    }

    .orbital-ring {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }

    .orbital-ring-1 {
      inset: 0;
      border: 2px dashed rgba(16, 185, 129, 0.35);
      animation: spinClockwise 12s linear infinite;
    }

    .orbital-ring-2 {
      inset: -10px;
      border: 1.5px dotted rgba(6, 182, 212, 0.3);
      animation: spinCounterClockwise 18s linear infinite;
    }

    .core-emblem {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, #10b981 0%, #06b6d4 100%);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 
        0 0 25px rgba(16, 185, 129, 0.5),
        0 0 45px rgba(6, 182, 212, 0.3);
      transform: rotate(45deg);
      animation: coreFloat 3.5s ease-in-out infinite;
      position: relative;
    }

    .core-emblem svg {
      transform: rotate(-45deg);
      width: 40px;
      height: 40px;
      fill: #ffffff;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
    }

    @keyframes spinClockwise {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes spinCounterClockwise {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }

    @keyframes coreFloat {
      0%, 100% { transform: rotate(45deg) translateY(0); }
      50% { transform: rotate(45deg) translateY(-4px); }
    }

    /* Titles */
    .title-group {
      text-align: center;
      z-index: 1;
      margin-top: 8px;
    }

    .brand-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .brand-title .accent {
      background: linear-gradient(90deg, #10b981, #06b6d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-subtitle {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 3px;
      font-weight: 500;
    }

    /* Progress and Status */
    .progress-section {
      width: 100%;
      z-index: 1;
      margin-top: 6px;
    }

    .status-text-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      padding: 0 4px;
    }

    .status-msg {
      font-size: 12px;
      color: #cbd5e1;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.3s ease;
    }

    .status-percentage {
      font-size: 12px;
      color: #10b981;
      font-family: monospace;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    /* Progress Track */
    .progress-track {
      width: 100%;
      height: 6px;
      background: rgba(30, 41, 59, 0.8);
      border-radius: 9999px;
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #10b981 0%, #06b6d4 100%);
      border-radius: 9999px;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.8);
      transition: width 0.35s ease;
      position: relative;
    }

    .progress-bar-fill::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.4) 50%,
        rgba(255, 255, 255, 0) 100%
      );
      animation: shimmer 1.8s infinite;
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    /* Footer Metadata */
    .footer-meta {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10.5px;
      color: #64748b;
      margin-top: 10px;
      padding: 0 4px;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="splash-card">
    <!-- Ambient Background Lighting -->
    <div class="ambient-orb ambient-orb-1"></div>
    <div class="ambient-orb ambient-orb-2"></div>

    <!-- Top Badge -->
    <div class="top-badge">
      <span class="pulse-dot"></span>
      <span>DESKTOP ENTERPRISE</span>
    </div>

    <!-- Center Emblem & Dual Orbitals -->
    <div class="logo-container">
      <div class="orbital-ring orbital-ring-1"></div>
      <div class="orbital-ring orbital-ring-2"></div>
      <div class="core-emblem">
        <svg viewBox="0 0 24 24">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>

    <!-- Brand Header -->
    <div class="title-group">
      <div class="brand-title">
        <span>ORBIX</span>
        <span class="accent">ERP</span>
      </div>
      <div class="brand-subtitle">نظام إدارة موارد المؤسسات والمحاسبة الذكية</div>
    </div>

    <!-- Dynamic Progress & Status -->
    <div class="progress-section">
      <div class="status-text-row">
        <div class="status-msg" id="statusMsg">جاري تشغيل محرك سطح المكتب...</div>
        <div class="status-percentage" id="percentText">0%</div>
      </div>
      <div class="progress-track">
        <div class="progress-bar-fill" id="progressBar"></div>
      </div>
    </div>

    <!-- Footer Meta -->
    <div class="footer-meta">
      <span>الإصدار v2.5.0 • وضع سطح المكتب المتكامل</span>
      <span>PostgreSQL & Node.js Engine</span>
    </div>
  </div>

  <script>
    // Boot sequence simulated steps with smooth easing
    const steps = [
      { progress: 18, text: "جاري فحص وتأمين بيئة سطح المكتب..." },
      { progress: 42, text: "التحقق من اتصال محرك البيانات المحلي..." },
      { progress: 68, text: "تهيئة المحرك الحسابي والخدمات المصرفية..." },
      { progress: 88, text: "تحميل واجهة المستخدم ومزامنة الجلسة..." },
      { progress: 100, text: "اكتمل الإقلاع! مرحباً بك في أوربكس..." }
    ];

    let currentStep = 0;
    const statusMsg = document.getElementById('statusMsg');
    const percentText = document.getElementById('percentText');
    const progressBar = document.getElementById('progressBar');

    function advanceProgress() {
      if (currentStep < steps.length) {
        const step = steps[currentStep];
        progressBar.style.width = step.progress + '%';
        percentText.innerText = step.progress + '%';
        
        statusMsg.style.opacity = '0';
        setTimeout(() => {
          statusMsg.innerText = step.text;
          statusMsg.style.opacity = '1';
        }, 150);

        currentStep++;
        const nextDelay = currentStep === steps.length ? 400 : 350;
        setTimeout(advanceProgress, nextDelay);
      }
    }

    // Start progress immediately
    setTimeout(advanceProgress, 100);
  </script>
</body>
</html>
